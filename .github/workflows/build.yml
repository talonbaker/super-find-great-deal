# Baseline CI: the Godot-free half of "the full suite". Builds the game assembly against the
# Godot.NET.Sdk and runs the xUnit project. The Godot scene suites need a Windows machine with
# PowerShell and an engine binary and are NOT run here — see tests/Run-AllTests.ps1.
name: build-and-unit-test
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build SuperFindGreatDeal.csproj --nologo
      - name: Unit tests
        run: dotnet test tests/unit/SailNet.Tests.csproj --nologo --no-build -v minimal
